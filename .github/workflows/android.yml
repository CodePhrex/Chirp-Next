name: Android foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu runners provide Android command-line tools.
      # Avoid setup-android's obsolete 'tools' package installation.
      - name: Provision Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then manager="$(command -v sdkmanager)"; fi
          test -x "$manager"
          "$manager" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chirp-lab-debug
          path: app/build/outputs/apk/debug/*.apk
