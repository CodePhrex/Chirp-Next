name: Android foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu runners provide Android command-line tools.
      # Avoid setup-android's obsolete 'tools' package installation.
      - name: Provision Android SDK
        shell: bash
        run: |
          command -v sdkmanager
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chirp-lab-debug
          path: app/build/outputs/apk/debug/*.apk
